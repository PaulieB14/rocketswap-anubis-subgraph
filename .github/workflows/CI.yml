name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build both subgraph targets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      # --legacy-peer-deps is required: upstream pins @typescript-eslint 2.x against
      # eslint 8, which npm refuses to resolve. The conflict is inherited, not ours.
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Both targets are built because src/common is SHARED between them. Changing
      # one schema without the other compiles fine for the target you are looking at
      # and breaks the other with type errors in the shared pricing code. Building
      # only v2 would not have caught the Bytes-as-IDs conversion breaking v2-tokens.
      #
      # codegen runs before each build on purpose: generated/ is rewritten per target,
      # so building v2 straight after a v2-tokens codegen fails with missing
      # Mint/Burn/Swap exports.
      - name: Build v2
        run: |
          npx mustache config/anubis/config.json v2-subgraph.template.yaml > v2-subgraph.yaml
          npx graph codegen v2-subgraph.yaml
          npx graph build v2-subgraph.yaml

      - name: Build v2-tokens
        run: |
          npx mustache config/anubis/config.json v2-tokens-subgraph.template.yaml > v2-tokens-subgraph.yaml
          npx graph codegen v2-tokens-subgraph.yaml
          npx graph build v2-tokens-subgraph.yaml

      # The whole point of the Bytes-as-IDs work. A String id sneaking back into
      # either schema should fail the build rather than be noticed months later.
      - name: Assert every entity id is Bytes
        run: |
          for f in src/v2/schema.graphql src/v2-tokens/schema.graphql; do
            if grep -E '^\s+id: ID!' "$f"; then
              echo "::error file=$f::entity id must be Bytes!, not ID! — see the Bytes-as-IDs section in README.md"
              exit 1
            fi
          done
          echo "all entity ids are Bytes in both schemas"
